name: CI/CD Winefinder

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-deploy:
    name: Tests & Déploiement Docker
    runs-on: self-hosted
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image de test
        shell: powershell
        run: |
          docker build -t winefinder:test .

      - name: Lancer les tests dans le conteneur
        shell: powershell
        run: |
          docker run --rm winefinder:test python -m unittest discover -s db_tests

      - name: Déployer le conteneur en production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: powershell
        run: |
          docker tag winefinder:test winefinder:latest
          docker stop winefinder 2>$null
          docker rm winefinder 2>$null
          docker run -d `
            --name winefinder `
            --restart unless-stopped `
            -p 5050:5000 `
            -v winefinder_data:/app/data `
            winefinder:latest
