name: CI/CD Winefinder

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
jobs:
  build-and-deploy:
    name: Build & Déploiement Docker
    runs-on: self-hosted
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        shell: powershell
        run: |
          docker build -t winefinder:latest .

      - name: Vérifier que l'application démarre (sanity check)
        shell: powershell
        run: |
          docker run --rm winefinder:latest python -m py_compile app.py

      - name: Redémarrer le conteneur en production
        shell: powershell
        run: |
          docker stop winefinder 2>$null
          docker rm winefinder 2>$null
          docker run -d `
            --name winefinder `
            --restart unless-stopped `
            -p 5050:5000 `
            -v winefinder_data:/app/data `
            winefinder:latest
