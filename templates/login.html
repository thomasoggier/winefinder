{% extends "base.html" %}
{% block content %}
<div class="bg-white p-6 rounded-2xl shadow-md mt-4 border border-stone-200">
  <div class="text-center mb-6">
    <div class="text-4xl mb-2">🍇</div>
    <h1 class="text-2xl font-bold text-rose-950">Dégustation à l'Aveugle</h1>
    <p class="text-sm text-stone-500 mt-1">Connectez-vous ou créez votre profil joueur</p>
  </div>

  <form method="POST" class="space-y-4">
    <div>
      <label class="block text-sm font-semibold text-stone-700 mb-1">Prénom ou Pseudo</label>
      <input type="text" name="username" required autocomplete="username" placeholder="Ex: Thomas"
        class="w-full border border-stone-300 rounded-xl px-4 py-3 bg-stone-50 focus:bg-white focus:ring-2 focus:ring-rose-900 outline-none">
    </div>
    <div>
      <label class="block text-sm font-semibold text-stone-700 mb-1">Code / Mot de passe simple</label>
      <input type="password" name="password" required autocomplete="current-password" placeholder="••••"
        class="w-full border border-stone-300 rounded-xl px-4 py-3 bg-stone-50 focus:bg-white focus:ring-2 focus:ring-rose-900 outline-none">
    </div>
    <div class="space-y-3 pt-2">
      <button type="submit" name="action" value="login"
        class="w-full bg-rose-900 text-white py-3.5 rounded-xl font-bold text-base shadow active:scale-95 transition">
        Se connecter
      </button>
      <button type="submit" name="action" value="register"
        class="w-full bg-stone-100 text-stone-800 border border-stone-300 py-3.5 rounded-xl font-bold text-base active:scale-95 transition">
        Nouveau joueur (Créer un compte)
      </button>
    </div>
  </form>
  <p class="text-xs text-stone-400 text-center mt-5">Le premier joueur inscrit devient Administrateur de la partie.</p>
</div>
{% endblock %}
