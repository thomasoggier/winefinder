{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-6 bg-white p-6 rounded-2xl shadow-sm border border-stone-200 space-y-5">
  <div class="text-center space-y-1">
    <div class="text-3xl">🍷</div>
    <h1 class="text-2xl font-extrabold text-rose-950">Blind Wine</h1>
    <p class="text-xs text-stone-500">Connectez-vous ou créez votre compte pour rejoindre la dégustation.</p>
  </div>

  <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-3">
    <div>
      <label class="block text-xs font-bold uppercase tracking-wider text-stone-500 mb-1">Pseudo</label>
      <input type="text" name="username" required autocomplete="username" placeholder="Votre prénom ou pseudo"
        class="w-full border border-stone-300 rounded-xl px-3 py-2.5 text-sm bg-stone-50 focus:bg-white">
    </div>
    <div>
      <label class="block text-xs font-bold uppercase tracking-wider text-stone-500 mb-1">Mot de passe</label>
      <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••"
        class="w-full border border-stone-300 rounded-xl px-3 py-2.5 text-sm bg-stone-50 focus:bg-white">
    </div>

    <div class="grid grid-cols-2 gap-2.5 pt-2">
      <button type="submit" name="action" value="login"
        class="py-3 rounded-xl font-extrabold text-sm bg-rose-900 hover:bg-rose-950 text-white shadow-sm active:scale-95 transition">
        Se connecter
      </button>
      <button type="submit" name="action" value="register"
        class="py-3 rounded-xl font-bold text-sm bg-stone-200 hover:bg-stone-300 text-stone-800 active:scale-95 transition">
        Créer un compte
      </button>
    </div>
  </form>
</div>
{% endblock %}
