{% extends "base.html" %}
{% block content %}
<div class="mb-5">
  <h1 class="text-2xl font-bold text-rose-950">🔗 Partager l'accès</h1>
  <p class="text-xs text-stone-500">Partagez cette adresse aux autres participants sur le réseau local.</p>
</div>

<div class="bg-white p-5 rounded-2xl shadow-sm border border-stone-200 space-y-4">
  <div>
    <label class="block text-xs font-bold uppercase tracking-wider text-stone-500 mb-1.5">Adresse de la soirée</label>
    <div class="flex gap-2">
      <input id="share-url-input" type="text" readonly value="{{ default_url }}"
        class="w-full border border-stone-300 rounded-xl px-3 py-2.5 text-sm font-mono bg-stone-50 text-stone-800">
      <button type="button" onclick="copyShareUrl()"
        class="bg-rose-900 hover:bg-rose-950 text-white text-xs font-bold px-4 py-2.5 rounded-xl shrink-0 transition">
        Copier
      </button>
    </div>
    <p id="copy-feedback" class="text-xs text-emerald-700 font-semibold mt-1.5 h-4"></p>
  </div>

  <div class="pt-2">
    <a href="{{ url_for('game.index') }}" class="inline-block text-xs font-bold text-rose-950 hover:underline">
      ← Retour à la partie
    </a>
  </div>
</div>

<script>
  function copyShareUrl() {
    const input = document.getElementById('share-url-input');
    const feedback = document.getElementById('copy-feedback');
    if (!input) return;
    navigator.clipboard?.writeText(input.value).then(function () {
      if (feedback) feedback.textContent = '✓ Lien copié dans le presse-papiers !';
    }).catch(function () {
      input.select();
      document.execCommand('copy');
      if (feedback) feedback.textContent = '✓ Lien sélectionné / copié !';
    });
  }
</script>
{% endblock %}
